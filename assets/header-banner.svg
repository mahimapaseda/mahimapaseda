<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Mahima Paseda Kusumsiri — Software Engineer, Full-Stack and Backend Systems">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="240" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="240" rx="14" fill="url(#glow)"/>

  <!-- Top & bottom subtle borders -->
  <rect x="0.5" y="0.5" width="1199" height="239" rx="14" fill="none" stroke="#f59e0b" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="64" y="42" width="56" height="4" rx="2" fill="url(#amberAccent)"/>

  <!-- Decorative geometric emblem on right -->
  <g opacity="0.16" stroke="#f59e0b" fill="none" stroke-width="1.5">
    <circle cx="1055" cy="120" r="78"/>
    <circle cx="1055" cy="120" r="54" stroke-dasharray="6 6"/>
    <path d="M1018 120 L1042 96 L1042 144 Z" fill="#f59e0b" fill-opacity="0.25"/>
    <path d="M1092 120 L1068 96 L1068 144 Z" fill="#f59e0b" fill-opacity="0.25"/>
  </g>

  <!-- Name -->
  <text x="64" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    Mahima Paseda Kusumsiri
  </text>

  <!-- Tagline -->
  <text x="64" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#fbbf24">
    Software Engineer  ·  Full-Stack &amp; Backend Systems  ·  AI/ML-Aware Web Apps
  </text>

  <!-- Tech & location pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="64" y="162" width="176" height="30" rx="6" fill="#0f172a" fill-opacity="0.75" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="152" y="182" text-anchor="middle" fill="#e2e8f0">www.mahimapaseda.lk</text>

    <rect x="252" y="162" width="186" height="30" rx="6" fill="#0f172a" fill-opacity="0.75" stroke="#475569" stroke-opacity="0.6"/>
    <text x="345" y="182" text-anchor="middle" fill="#cbd5e1">Pussellawa, Sri Lanka</text>

    <rect x="450" y="162" width="290" height="30" rx="6" fill="#0f172a" fill-opacity="0.75" stroke="#475569" stroke-opacity="0.6"/>
    <text x="595" y="182" text-anchor="middle" fill="#cbd5e1">Laravel · MERN · Kotlin · Firebase</text>
  </g>
</svg>

